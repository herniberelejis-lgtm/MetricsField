name: Verificación

# Corre el mismo ciclo que se pide antes de cada commit (ver CLAUDE.md):
# tipos + tests + build. Hasta ahora eso dependía de que cada uno se
# acordara; con esto, un PR que rompe algo no se puede fusionar sin que
# quede a la vista.
#
# No necesita ningún secreto: el build de Next no se conecta a la base
# (todas las páginas son force-dynamic, se renderizan en request) y los
# tests son de lógica pura. DATABASE_URL se pasa en falso solo porque
# lib/sql.ts corta el arranque si la variable no existe.

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]
  # Una vez por semana aunque nadie pushee: los avisos de seguridad de
  # dependencias se publican solos (así apareció el de nodemailer), y sin
  # esto recién se veían en el próximo PR. Lunes 9:17 hora de Córdoba.
  schedule:
    - cron: "17 12 * * 1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          ADMIN_PASSWORD: build-no-se-usa

      - name: Vulnerabilidades en dependencias
        run: npm audit --audit-level=high

  # Prueba cruzada de permisos contra la app de verdad: build de producción
  # + Postgres con db/seed.sql (datos sintéticos). Comercio A contra B,
  # portal con gate de Google, cuenta en baja, acciones de admin sin sesión,
  # límites de intentos, y que en producción NO se entre con contraseña.
  # Ver scripts/prueba-permisos.mjs.
  permisos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prueba
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/prueba
      ADMIN_PASSWORD: clave-solo-para-el-ci
      CRON_SECRET: secreto-solo-para-el-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cargar esquema y datos de prueba
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed.sql

      - name: Build de producción
        run: npm run build

      - name: Permisos (modo preview)
        run: |
          PORT=3100 npx next start > servidor.log 2>&1 &
          SERVIDOR=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/login && break; sleep 1; done
          node scripts/prueba-permisos.mjs || { tail -50 servidor.log; exit 1; }
          kill $SERVIDOR

      - name: Permisos (modo producción, solo Google)
        run: |
          PORT=3100 VERCEL_ENV=production npx next start > servidor-prod.log 2>&1 &
          SERVIDOR=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/login && break; sleep 1; done
          MODO=produccion node scripts/prueba-permisos.mjs || { tail -50 servidor-prod.log; exit 1; }
          kill $SERVIDOR
